[project]
name = "medsignal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "indlanamratha", email = "namrathaindla62@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "evidently==0.7.23",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "orjson>=3.12.0",
    "pandas>=3.0.6",
    "plotly>=5.10,<6",
    "prefect>=3.8.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "sqlglot>=30.19.0",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.53.0",
    "xgboost>=3.2.0",
]

[project.scripts]
medsignal = "medsignal:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
