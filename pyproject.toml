[project]
name = "medsignal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "indlanamratha", email = "namrathaindla62@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "orjson>=3.12.0",
    "pandas>=3.0.6",
    "prefect>=3.8.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
]

[project.scripts]
medsignal = "medsignal:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
